name: Pipeline Orders

on:
  workflow_dispatch:

jobs:
  run-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Initialiser la base de données
        run: sqlite3 base_test.db < sql/init_orders.sql

      - name: Nettoyer et filtrer les commandes
        run: sqlite3 base_test.db < sql/clean_orders.sql
